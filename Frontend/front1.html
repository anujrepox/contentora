<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contentora - AI Creative Studio</title>
    
    <!-- Google Fonts: Orbitron for Headlines, Poppins for UI -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================
           GLOBAL RESET & VARIABLES (PINK THEME)
           ========================================= */
        :root {
            --bg-main: #050505; 
            --pink: #FF007F; 
            --pink-light: #FF4DA6;
            --text-main: #FFFFFF;
            --text-muted: #A1A1AA;
            --font-body: 'Poppins', sans-serif;
            --font-display: 'Orbitron', sans-serif; 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            position: relative;
            perspective: 1200px; 
            font-family: var(--font-body);
        }

        /* =========================================
           BACKGROUND SHADOW & GRID
           ========================================= */
        .bg-base {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; z-index: -3; 
            background: 
                radial-gradient(circle at 0% 0%, rgba(255, 0, 127, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(255, 0, 127, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 50%, rgba(255, 0, 127, 0.15) 0%, transparent 50%);
        }

        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background-image: 
                linear-gradient(to right, rgba(255, 100, 180, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 100, 180, 0.06) 1px, transparent 1px);
            background-size: 60px 60px; 
            mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        .container {
            max-width: 1300px;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* =========================================
           GLOSSY BANNER NAVBAR
           ========================================= */
        .navbar-wrapper {
            padding-top: 20px;
            width: 100%;
            display: flex;
            justify-content: center; 
            flex-shrink: 0;
        }

        nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px; 
            background: rgba(20, 20, 20, 0.5); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            padding-left: 10px;
        }
        .logo i { color: var(--pink); font-size: 20px; }

        .nav-center {
            display: flex;
            gap: 8px; 
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px; 
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08); 
            border-color: rgba(255, 255, 255, 0.15);
        }

        .nav-link i { font-size: 10px; color: var(--text-muted); }

        .btn-nav {
            background: transparent;
            color: var(--text-main);
            padding: 10px 24px;
            border-radius: 50px; 
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-nav:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-main);
        }

        /* =========================================
           MAIN CONTENT
           ========================================= */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center; 
            gap: 40px; 
            padding-bottom: 40px;
        }

        .hero-left {
            flex: 1;
            max-width: 600px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 0, 127, 0.08);
            border: 1px solid rgba(255, 0, 127, 0.2);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 24px;
            color: #E5E5E5;
            font-family: var(--font-body);
        }
        .badge i { color: var(--pink); font-size: 10px; }

        .hero-left h1 {
            font-family: var(--font-display);
            font-size: 65px; 
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 0px; 
            margin-bottom: 24px;
            text-transform: uppercase; 
        }

        .no-wrap {
            white-space: nowrap; 
        }

        .hero-left h1 span.highlight { 
            color: var(--pink); 
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }

        .hero-left p {
            font-size: 18px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 450px;
            font-family: var(--font-body);
        }

        .hero-buttons { display: flex; gap: 16px; }

        .btn-primary {
            background: linear-gradient(90deg, #FF007F, #FF4DA6);
            color: #FFF; 
            padding: 16px 36px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.3);
            transition: 0.3s;
            font-family: var(--font-body);
        }
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.5);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            padding: 16px 36px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            font-family: var(--font-body);
        }
        .btn-outline:hover { 
            background: rgba(255, 255, 255, 0.05); 
            border-color: var(--text-main);
        }

        /* =========================================
           THE 3D SCENE (Right Side)
           ========================================= */
        .hero-right { 
            flex: 1.2; 
            position: relative; 
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scene-container {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: floatScene 8s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* THE NEW IMAGE REPLACEMENT */
        .creator-image-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            z-index: 3;
            /* Adds a pink glow behind the image */
            filter: drop-shadow(0px 20px 40px rgba(255, 0, 127, 0.25));
            animation: floatWidget 5s ease-in-out infinite alternate;
        }

        .creator-image-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            /* Masking to fade the bottom nicely into the background */
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }

        /* =========================================
           FLOATING WIDGETS
           ========================================= */
        .widget {
            position: absolute;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 4;
        }

        .widget-chart {
            top: 15%;
            left: -5%; /* Shifted left to make room for the bigger image */
            width: 160px;
            animation: floatWidget 6s ease-in-out infinite alternate;
        }
        .widget-chart h5 { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 4px; }
        .widget-chart h4 { font-size: 20px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;}
        .widget-chart h4 span { color: #00FF88; font-size: 12px; } 
        
        .chart-line {
            width: 100%;
            height: 40px;
            stroke: var(--pink);
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .widget-menu {
            top: 10%;
            right: -5%; 
            width: 250px; 
            animation: floatWidget 7s ease-in-out infinite alternate-reverse;
            padding: 12px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            transition: 0.3s;
            white-space: nowrap; 
        }
        .menu-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .menu-item i { font-size: 16px; color: var(--pink); width: 20px; text-align: center; flex-shrink: 0; }

        /* =========================================
           ANIMATIONS
           ========================================= */
        @keyframes floatScene {
            0% { transform: translateY(0px) rotateX(0deg); }
            50% { transform: translateY(-15px) rotateX(2deg); }
            100% { transform: translateY(0px) rotateX(0deg); }
        }

        @keyframes floatWidget {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-15px); }
        }

        @media (max-height: 850px) {
            .hero-left h1 { font-size: 55px; }
            .hero-left p { font-size: 16px; }
            .creator-image-container { max-width: 320px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND SHADOW & GRID -->
    <div class="bg-base"></div>
    <div class="bg-grid"></div>

    <div class="container">
        
        <!-- NAVBAR -->
        <div class="navbar-wrapper">
            <nav>
                <div class="logo">
                    <i class="fa-solid fa-star-of-life"></i> Contentora
                </div>
                <div class="nav-center">
                    <a href="#" class="nav-link active">Home</a>
                    <a href="#" class="nav-link">Tools <i class="fa-solid fa-chevron-down"></i></a>
                    <a href="#" class="nav-link">Pricing</a>
                    <a href="#" class="nav-link">About</a>
                </div>
                <button class="btn-nav">Log In</button>
            </nav>
        </div>

        <!-- MAIN HERO SECTION -->
        <div class="main-content">
            
            <!-- LEFT SIDE -->
            <div class="hero-left">
                <div class="badge">
                    <i class="fa-solid fa-star"></i> AI-Powered Creative Studio
                </div>
                
                <h1><span class="no-wrap">Break the Feed.</span><br><span class="highlight">Create.</span></h1>
                
                <p>Your all-in-one platform to get video ideas, write scripts and discover trending topics.</p>
                
                <div class="hero-buttons">
                    <button class="btn-primary">Start Creating Free <i class="fa-solid fa-arrow-right"></i></button>
                    <button class="btn-outline">Watch Demo <i class="fa-regular fa-circle-play"></i></button>
                </div>
            </div>

            <!-- RIGHT SIDE (The 3D Scene) -->
            <div class="hero-right">
                <div class="scene-container">
                    
                    <!-- THE REAL IMAGE -->
                    <div class="creator-image-container">
                        <!-- Using a high-quality transparent PNG of a creator from a free stock site -->
                        <img src="https://png.pngtree.com/png-clipart/20230823/original/pngtree-young-woman-content-creator-recording-video-with-smartphone-on-tripod-png-image_10513396.png" alt="Content Creator">
                    </div>

                    <!-- Floating Widget: Chart -->
                    <div class="widget widget-chart">
                        <h5>Your Growth</h5>
                        <h4>+247% <span><i class="fa-solid fa-arrow-trend-up"></i></span></h4>
                        <svg viewBox="0 0 100 40" class="chart-line">
                            <path d="M0,35 L20,30 L40,32 L60,15 L80,20 L100,5" />
                        </svg>
                    </div>

                    <!-- Floating Widget: Menu -->
                    <div class="widget widget-menu">
                        <div class="menu-item"><i class="fa-regular fa-pen-to-square"></i> Script Writer</div>
                        <div class="menu-item"><i class="fa-regular fa-lightbulb"></i> Idea Generator</div>
                        <div class="menu-item"><i class="fa-solid fa-arrow-trend-up"></i> Trending Topics</div>
                        <div class="menu-item"><i class="fa-solid fa-hashtag"></i> Captions & Hashtags</div>
                        <div class="menu-item"><i class="fa-regular fa-calendar-days"></i> Content Planner</div>
                    </div>

                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
