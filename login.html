<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Contentora</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #050505; 
            --pink: #FF007F; 
            --pink-glow: rgba(255, 0, 127, 0.4);
            --text-main: #FFFFFF;
            --text-muted: #A1A1AA;
            --font-body: 'Poppins', sans-serif;
            --font-display: 'Orbitron', sans-serif; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* =========================================
           BACKGROUND EFFECTS
           ========================================= */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background-image: 
                linear-gradient(to right, rgba(255, 0, 127, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 0, 127, 0.05) 1px, transparent 1px);
            background-size: 60px 60px; 
            mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
        }

        .bg-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.15) 0%, transparent 60%);
            z-index: -1;
        }

        /* =========================================
           LOGIN CARD
           ========================================= */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 0, 127, 0.05);
            position: relative;
            z-index: 1;
            animation: fadeIn 0.5s ease;
        }

        /* Top glowing accent line */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 50%; height: 2px;
            background: var(--pink);
            box-shadow: 0 0 15px var(--pink);
            border-radius: 0 0 10px 10px;
        }

        /* Logo */
        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            width: 40px; height: 40px;
            border: 2px solid var(--pink);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px var(--pink-glow);
        }
        .logo-icon i { color: var(--pink); font-size: 18px; }

        .logo-text {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Headings */
        .login-card h2 {
            font-family: var(--font-display);
            font-size: 22px;
            text-align: center;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .login-card p {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Inputs */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            top: 50%; left: 20px;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: 0.3s;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 20px 15px 50px;
            color: white;
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--pink);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
            background: rgba(20, 5, 15, 0.6);
        }

        .input-group input:focus + i {
            color: var(--pink);
        }

        /* Forgot Password */
        .forgot-pass {
            display: block;
            text-align: right;
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .forgot-pass:hover { color: var(--pink); }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, #FF007F, #D00068);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-family: var(--font-body);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider span { padding: 0 10px; }

        /* Google Button */
        .btn-google {
            width: 100%;
            background: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 12px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            margin-bottom: 30px;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.4);
        }
        
        .btn-google i { color: #EA4335; font-size: 16px;}

        /* Footer Link */
        .footer-link {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--pink);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
        .footer-link a:hover { text-shadow: 0 0 10px var(--pink-glow); }

        /* Back to Home Button */
        .btn-back {
            position: absolute;
            top: 30px; left: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            z-index: 10;
        }
        .btn-back:hover { color: var(--pink); transform: translateX(-3px); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 500px) {
            .login-card { padding: 30px 20px; }
            .btn-back { top: 15px; left: 15px; }
        }
    </style>
</head>
<body>

    <!-- Background Effects -->
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <!-- Back Button -->
    <a href="index.html" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>

    <!-- Login Card -->
    <div class="login-card">
        
        <!-- Logo -->
        <div class="logo-area">
            <div class="logo-icon"><i class="fa-solid fa-crown"></i></div>
            <div class="logo-text">Contentora</div>
        </div>

        <h2>Welcome Back</h2>
        <p>Log in to continue creating masterpieces.</p>

        <!-- Form -->
        <form onsubmit="event.preventDefault(); window.location.href='idea.html';">
            
            <div class="input-group">
                <input type="email" placeholder="Email Address" required>
                <i class="fa-regular fa-envelope"></i>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Password" required>
                <i class="fa-solid fa-lock"></i>
            </div>

            <a href="#" class="forgot-pass">Forgot Password?</a>

            <button type="submit" class="btn-submit">
                Log In <i class="fa-solid fa-arrow-right-to-bracket" style="margin-left: 8px;"></i>
            </button>

        </form>

        <!-- Divider -->
        <div class="divider">
            <span>OR</span>
        </div>

        <!-- Google Login -->
        <button class="btn-google" onclick="window.location.href='idea.html';">
            <i class="fa-brands fa-google"></i> Continue with Google
        </button>

        <!-- Sign Up Link -->
        <div class="footer-link">
            Don't have an account? <a href="#">Sign Up</a>
        </div>

    </div>

</body>
</html>
